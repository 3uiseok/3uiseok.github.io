# Sveltia CMS 설정. 로그인은 "Sign In with Token"(GitHub 개인 액세스 토큰)으로 한다.
backend:
  name: github
  repo: 3uiseok/3uiseok.github.io
  branch: main

site_url: https://3uiseok.github.io
display_url: https://3uiseok.github.io

media_folder: assets/img/posts
public_folder: /assets/img/posts

collections:
  - name: posts
    label: 글
    label_singular: 글
    folder: _posts
    create: true
    # 한글 제목이 파일명·주소에 들어가지 않도록 영문 주소 필드로 파일명을 만든다.
    slug: "{{date | date('YYYY-MM-DD')}}-{{url_slug}}"
    summary: "{{title}} ({{date | date('YYYY-MM-DD')}})"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: 제목, widget: string }
      - name: url_slug
        label: 영문 주소
        widget: string
        hint: "글 주소가 됩니다. 예) react-intro → /posts/react-intro/ (영문 소문자, 숫자, 하이픈만)"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요']
      - name: date
        label: 작성일
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        default: "{{now}}"
      - name: categories
        label: 카테고리
        widget: list
        hint: "최대 2단계. 예) 블로그, 시작하기"
        max: 2
        required: false
      - { name: tags, label: 태그, widget: list, hint: "소문자 권장. 예) react, javascript", required: false }
      - { name: description, label: 요약, widget: text, hint: "목록·검색 결과에 보이는 설명 (비워 두면 본문 앞부분)", required: false }
      - { name: pin, label: 홈 상단 고정, widget: boolean, default: false, required: false }
      - { name: body, label: 본문, widget: markdown }
